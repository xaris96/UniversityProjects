<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Station Resources</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Space Station Resource Stock</h1>
        <nav>
            <a href="{{ url_for('add_resource') }}">Add Resource</a>
        </nav>
    </header>
    <main>
        <h2>Resource List</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for resource in resources %}
                <tr>
                    <td>{{ resource.id }}</td>
                    <td>{{ resource.name }}</td>
                    <td>{{ resource.quantity }}</td>
                    <td>
                        <a href="{{ url_for('edit_resource', resource_id=resource.id) }}">Edit</a>
                        <form action="{{ url_for('delete_resource', resource_id=resource.id) }}" method="POST" style="display:inline;">
                            <button type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
